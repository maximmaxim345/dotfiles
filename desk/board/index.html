<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f0f0ec; --text: #1c1c1a; --muted: #6b6b66; --border: #dcdcd6;
    --accent: #2f5fd0; --accent-soft: #e6ecfb; --good: #1f7a45; --good-soft: #e3f3e9; --warn: #a8650a; --warn-soft: #fbf0dc;
    --bad: #b3322b; --bad-soft: #fbe6e4; --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --surface: #1f1f1d; --surface-2: #292927; --text: #ecece8; --muted: #a0a09a; --border: #3a3a37;
      --accent: #8fb0ff; --accent-soft: #1f2b4a; --good: #6fcf97; --good-soft: #17301f; --warn: #e5b25d; --warn-soft: #3a2c12;
      --bad: #f08a83; --bad-soft: #3d1c1a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); padding-bottom: 96px; }
  h2, h3 { line-height: 1.25; margin: 0 0 8px; }
  a { color: var(--accent); }
  code, pre, .mono { font-family: var(--mono); font-size: 13px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .shell { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  .grow { flex: 1; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; line-height: 18px; background: var(--surface-2); color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .tag.good { background: var(--good-soft); color: var(--good); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .tag.accent { background: var(--accent-soft); color: var(--accent); }
  .btn { padding: 6px 12px; min-height: 36px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .45; cursor: default; }
  .quiet { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0 6px; min-height: 36px; font-size: 13px; }
  .quiet.ref { padding: 0; text-align: left; font-size: inherit; }
  .refs { display: flex; flex-direction: column; align-items: flex-start; }
  select, input[type=search], input[type=text] { min-height: 36px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; }
  textarea { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; background: var(--surface); resize: vertical; font-size: 14px; }
  input[type=checkbox] { accent-color: var(--accent); width: 18px; height: 18px; vertical-align: -3px; }

  .top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--border); }
  .topbar { display: flex; align-items: center; gap: 10px 12px; padding: 10px 0 6px; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 18px; }
  .health { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; display: inline-block; }
  .dot.bad { background: var(--bad); } .dot.off { background: var(--muted); }
  .health.bad { color: var(--bad); font-weight: 600; }
  .glance { font-size: 13px; color: var(--muted); }
  .glance b { color: var(--text); }
  .search { width: 200px; }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { border: 0; background: none; color: var(--muted); padding: 8px 12px; min-height: 44px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .tab .n { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 3px; }
  .scope { font-size: 13px; color: var(--muted); }

  .banner { margin: 14px 0 0; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--bad); background: var(--bad-soft); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .banner .bt { flex: 1 1 260px; font-size: 14px; }
  .banner .bt b { display: block; color: var(--bad); }
  .panel { padding-top: 16px; }
  .cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  .sh { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 8px; flex-wrap: wrap; }
  .sh:first-child { margin-top: 0; }
  .sh h2 { margin: 0; font-size: 16px; }
  .sh .n { color: var(--muted); font-size: 13px; }
  .sh .act { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .hint { font-size: 13px; color: var(--muted); margin: -4px 0 8px; }
  .empty { padding: 14px; color: var(--muted); font-size: 14px; }

  .list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .r { display: grid; grid-template-columns: 112px minmax(0, 1fr) 64px auto; grid-template-areas: "k main mins act"; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--border); cursor: pointer; min-height: 58px; }
  .r:first-child { border-top: 0; }
  .r:hover { background: var(--surface-2); }
  .r.from { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
  .r:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .r .k { grid-area: k; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-width: 0; }
  .r .main { grid-area: main; min-width: 0; }
  .r .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r .t code { font-size: .92em; }
  .r .c { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r .m { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r .m a { color: var(--accent); }
  .budget .over { margin: 8px 0 0; font-size: 14px; color: var(--warn); font-weight: 600; }
  .glance-auto { padding: 0; font-size: 13px; min-height: 0; }
  .r .c .eff { color: var(--text); }
  .r .mins { grid-area: mins; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; line-height: 1.3; }
  .r .mins b { display: block; font-size: 14px; }
  .r .mins span { color: var(--muted); }
  .r .mins span.old { color: var(--warn); font-weight: 600; }
  .r .act { grid-area: act; display: flex; gap: 6px; }
  .r .act .btn { font-size: 13px; padding: 4px 10px; }
  .r.child { padding-left: 38px; }
  .r.dim { opacity: .65; }
  .r.selected { background: var(--accent-soft); }
  .r.dragging { opacity: .4; }
  .kind { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; line-height: 18px; border: 1px solid var(--border); background: var(--surface); color: var(--text); white-space: nowrap; font-weight: 600; }
  .kind.decide, .kind.push, .kind.post { border-color: var(--accent); color: var(--accent); }
  .kind.failed, .kind.desk { border-color: var(--bad); color: var(--bad); }
  .r .num { min-width: 18px; text-align: right; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  @media (min-width: 641px) { .r.now { grid-template-columns: 136px minmax(0, 1fr) 88px auto; } }
  .att { margin-bottom: 8px; }
  .att-h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; }
  .att-h .muted { font-variant-numeric: tabular-nums; }
  .stack { display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface-2); margin: 8px 0 6px; }
  .gdot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; flex: none; }
  .g-act { background: var(--bad); } .g-unblock { background: var(--warn); } .g-land { background: var(--good); } .g-decide { background: var(--muted); }
  .att .legend b { color: var(--text); margin-right: 4px; }
  .ag { margin-top: 22px; }
  .ag-h { display: flex; align-items: center; flex-wrap: wrap; gap: 0 2px; margin-bottom: 8px; }
  .ag-h h2 { margin: 0; font-size: 16px; }
  .ag-h .n { margin-left: auto; color: var(--muted); font-size: 13px; }
  .ag-h .sub { flex-basis: 100%; padding-left: 15px; font-size: 13px; color: var(--muted); }
  .size { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); font-size: 12px; font-weight: 700; }
  @media (max-width: 640px) {
    .r { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "k mins" "main main"; gap: 4px 10px; padding: 12px 14px; }
    .r .act { display: none; }
    .r .t, .r .c { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .r .mins { display: flex; gap: 8px; align-items: baseline; }
    .r .mins b { display: inline; }
    .r.child { padding-left: 28px; }
    .search { width: 100%; order: 5; }
    .sheet { width: 100%; }
    .ent .links a, .ent .links button { min-height: 40px; }
  }

  .rail .card { margin-bottom: 12px; }
  .rail h3 { font-size: 14px; margin-bottom: 6px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 5px 0; border-top: 1px solid var(--border); }
  .kv:first-of-type { border-top: 0; }
  .kv span:first-child { color: var(--muted); }
  .mini { font-size: 13px; padding: 6px 0; border-top: 1px solid var(--border); cursor: pointer; }
  .mini:first-of-type { border-top: 0; }
  .mini .muted { display: block; font-size: 12px; }

  .budget { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
  .budget .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .meter { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); margin: 10px 0 6px; }
  .meter .a { background: var(--accent); }
  .meter .b { background: var(--accent-soft); border-left: 1px solid var(--accent); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; font-size: 13px; }
  .cut { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--surface-2); border-top: 1px dashed var(--accent); border-bottom: 1px dashed var(--accent); font-size: 13px; color: var(--accent); font-weight: 600; }
  .later-h { padding: 6px 14px; font-size: 12px; color: var(--muted); background: var(--surface-2); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 8px; }
  .drop { min-height: 8px; }
  .drop.over { outline: 2px dashed var(--accent); outline-offset: -2px; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  .chipbtn { font-size: 13px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 0 12px; min-height: 36px; cursor: pointer; }
  .chipbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .grp { margin-bottom: 8px; }
  .gh { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; min-height: 48px; cursor: pointer; color: var(--text); }
  .gh .gn { font-weight: 600; }
  .gh .gc { color: var(--muted); font-size: 13px; }
  .gh .chev { margin-left: auto; color: var(--muted); font-size: 13px; }
  .grp.open .gh { border-radius: var(--radius) var(--radius) 0 0; }
  .grp .gb { border: 1px solid var(--border); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); overflow: hidden; background: var(--surface); }
  .grp .gb .list { border: 0; border-radius: 0; }
  .gfoot { padding: 8px 14px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .crumb { font-size: 13px; color: var(--muted); }
  .goal-h { font-size: 22px; margin: 2px 0 4px; }
  .band { display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 12px 16px; margin: 12px 0; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--accent-soft); font-size: 14px; }
  .band b { font-size: 20px; color: var(--accent); margin-right: 6px; }
  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
  @media (max-width: 640px) { .pair { grid-template-columns: minmax(0, 1fr); } }
  .pair h3, .ms h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 6px; }
  .pair ul { margin: 0; padding-left: 18px; }
  .ms { margin-bottom: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .ms .mh { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; }
  .ms .num { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .ms .mt { font-weight: 600; font-size: 16px; }
  .ms .mx { font-size: 13px; color: var(--muted); }
  .ms .mx b { color: var(--text); }
  .ms .research { padding: 8px 14px 10px; border-top: 1px solid var(--border); font-size: 13px; }
  .ms .research ul { margin: 4px 0 0; padding-left: 18px; }
  .ms .list { border: 0; border-top: 1px solid var(--border); border-radius: 0; }
  .r.goal .t { color: var(--accent); }
  .ent { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 14px; }
  .ent:first-child { border-top: 0; }
  .ent .t { font-weight: 600; overflow-wrap: anywhere; }
  .ent .c { font-size: 13px; color: var(--muted); }
  .ent .links { display: flex; flex-wrap: wrap; gap: 0 2px; margin-top: 2px; }
  .ent .links a, .ent .links button { font-size: 13px; min-height: 32px; display: inline-flex; align-items: center; padding: 0 6px; }
  .ent.group { background: var(--surface-2); font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 6px 14px; }
  details.fold { margin-top: 4px; font-size: 13px; }
  details.fold > summary { cursor: pointer; color: var(--accent); min-height: 28px; line-height: 28px; }
  details.fold pre { white-space: pre-wrap; font-family: var(--font); background: var(--surface-2); border-radius: 6px; padding: 6px 8px; margin: 4px 0; }
  .post + .post { margin-top: 8px; }
  .post .by, .comment .who { font-size: 12px; color: var(--muted); }
  .chat .btn { margin-top: 4px; }

  .wt { padding: 10px 14px; border-top: 1px solid var(--border); }
  .wt:first-child { border-top: 0; }
  .wt .p { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .wt .muted { font-size: 12px; display: block; }

  .scrim { position: fixed; inset: 0; background: var(--text); opacity: .25; z-index: 40; }
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: 560px; max-width: 100%; background: var(--bg); border-left: 1px solid var(--border); z-index: 50; display: flex; flex-direction: column; }
  .sheet .sh-top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
  .sheet .sh-body { flex: 1; overflow-y: auto; padding: 16px; }
  .sheet .sh-bar { border-top: 1px solid var(--border); background: var(--surface); padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .sheet .sh-bar .btn.primary { flex: 1 1 140px; }
  .sheet h2 { font-size: 18px; margin: 4px 0 4px; }
  .sheet h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
  .needsbox { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius); padding: 10px 12px; margin: 12px 0; font-size: 14px; display: grid; gap: 8px; }
  .needsbox b.l { display: block; color: var(--accent); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .fields { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 10px; font-size: 14px; margin: 12px 0; align-items: center; }
  .fields dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .fields dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .fields select { width: 100%; }
  .grants { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin-top: 6px; }
  .grants label { min-height: 32px; display: inline-flex; align-items: center; gap: 6px; }
  .blocker { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .blocker.resolved { color: var(--muted); text-decoration: line-through; }
  .md { font-size: 14px; overflow-wrap: anywhere; }
  .md :is(h1, h2, h3, h4, h5, h6) { font-size: 15px; margin: 14px 0 6px; text-transform: none; letter-spacing: 0; color: var(--text); }
  .md :is(p, ul, ol, pre) { margin: 0 0 10px; }
  .md :is(ul, ol) { padding-left: 22px; }
  .md code { background: var(--surface-2); padding: 1px 4px; border-radius: 4px; font-size: 12.5px; }
  .md pre { background: var(--surface-2); padding: 8px 10px; border-radius: 6px; overflow: auto; white-space: pre-wrap; }
  .md pre code { padding: 0; background: none; }
  .sec { border-top: 1px solid var(--border); padding: 6px 0; }
  .sec > summary { cursor: pointer; font-weight: 600; min-height: 32px; line-height: 32px; }
  .comment { border-left: 2px solid var(--border); padding: 2px 0 2px 10px; margin: 8px 0; font-size: 14px; }
  .comment.desk { border-left-color: var(--accent); }
  .replies { margin-left: 18px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 18px; }

  .modal { position: fixed; z-index: 50; left: 50%; top: 10vh; translate: -50% 0; width: min(640px, calc(100% - 24px)); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .modal h3 { margin: 0 0 4px; font-size: 16px; }
  .modal p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .modal textarea { min-height: 180px; }
  .modal .row { margin-top: 10px; }
  .modal .row select { flex: 1 1 200px; min-width: 0; }
  .bulk { position: fixed; left: 50%; bottom: 16px; translate: -50% 0; z-index: 30; width: max-content; max-width: calc(100vw - 16px); background: var(--text); color: var(--bg); border-radius: 12px; padding: 8px 8px 8px 16px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .bulk .btn, .bulk select { background: transparent; color: var(--bg); border-color: var(--muted); }
  .bulk select option { color: var(--text); background: var(--surface); }
  .toast { position: fixed; bottom: 20px; right: 20px; z-index: 60; background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; max-width: calc(100vw - 40px); }
  table.est { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.est td, table.est th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); }
  table.est th { color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
<div class="top">
  <div class="shell">
    <div class="topbar">
      <span class="brand">Desk</span>
      <span class="health" id="health"></span>
      <span class="glance" id="glance"></span>
      <span class="grow"></span>
      <input type="search" class="search" id="q" placeholder="Search  /" autocomplete="off" aria-label="Search items">
      <span class="row"><button class="btn" type="button" id="captureBtn">Capture</button>
      <button class="btn" type="button" id="settingsBtn">Settings</button></span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Board sections" id="tabs"></nav>
  </div>
</div>
<main class="shell">
  <div id="banner"></div>
  <section class="panel" id="panel"></section>
</main>
<div id="bulk" class="bulk" hidden></div>
<div id="overlay"></div>

function commentGroups(comments) {

    if (["desk", "manager"].includes(c.by) && head?.by === "me") groups.at(-1).replies.push(c);

}
